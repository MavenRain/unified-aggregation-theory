name = "unified-aggregation-theory"
version = "0.1.0"
defaultTargets = ["UnifiedAggregation"]

[[lean_lib]]
name = "UnifiedAggregation"
# TODO: re-enable `-DwarningAsError=true` once Phase 1 lands and the
# Phase 0 `sorry` stubs are replaced with real proofs.

# Direct dependency on kan-tactics for the `kan_subst` / `kan_by_cases`
# tactics used throughout the proofs.  Git require (CI-resolvable),
# matching the comp-cat-theory / arrow-cat pattern below.
[[require]]
name = "kan-tactics"
git = "https://github.com/MavenRain/kan-tactics.git"
rev = "main"

[[require]]
name = "comp-cat-theory"
git = "https://github.com/MavenRain/comp-cat-theory.git"
rev = "main"

[[require]]
name = "arrow-cat"
git = "https://github.com/MavenRain/arrow-cat.git"
rev = "main"

# Mathlib-free ordered-field (ℚ) decision procedure `kan_saturate`, used by the
# Schelling-Ising mean-field bifurcation (rational algebraic-sigmoid model).
# Declared after comp-cat-theory / kan-tactics so this root's `main` pins win the
# shared-dependency diamond.
[[require]]
name = "kan-saturation"
git = "https://github.com/MavenRain/kan-saturation.git"
rev = "main"

[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4"
rev = "main"
