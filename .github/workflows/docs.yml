name: Build and Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan + Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Resolve dependencies
        run: lake update

      - name: Build library
        run: lake build

      - name: Build API documentation (doc-gen4)
        run: lake build UnifiedAggregation:docs

      - name: Stage docs for Pages
        run: |
          mkdir -p _site
          cp -r .lake/build/doc/* _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
